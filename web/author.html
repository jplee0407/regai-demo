<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화관법 규칙 저작 도구 · 시연</title>
<style>
  :root {
    --navy: #1B2F5B; --blue: #2D5FA8; --lblue: #9DB9E0; --bg: #EEF3FA; --orange: #C9822B; --lorange: #FBF1E1;
    --red: #D64541; --lred: #FBE7E6; --green: #3A9B6A; --lgreen: #E4F3EB; --text: #1F2A3C; --sub: #5B6577; --line: #D3DCEA; --page: #F6F8FC; --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: var(--page); color: var(--text); font-size: 14px; line-height: 1.55; }
  header { background: var(--navy); color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 19px; }
  header p { margin: 4px 0 0; color: #C9D7EC; font-size: 12.5px; }
  header .who { font-size: 12.5px; color: #C9D7EC; text-align: right; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 48px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 16px 0 12px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button { border: 1px solid var(--line); background: #fff; color: var(--sub); padding: 8px 12px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13.5px; position: relative; }
  .tabs button.on { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 700; }
  .tabs .dot { position: absolute; top: -5px; right: -5px; background: var(--red); color: #fff; font-size: 10.5px; border-radius: 999px; padding: 0 6px; font-weight: 700; }
  .date { display: flex; gap: 8px; align-items: center; color: var(--sub); }
  input[type=date], input[type=text], input[type=number], select, textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text); }
  textarea { width: 100%; min-height: 70px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(27,47,91,.06); }
  .card h2 { margin: 0 0 4px; font-size: 16px; color: var(--navy); }
  .card h3 { margin: 14px 0 6px; font-size: 14px; color: var(--navy); }
  .card .desc { color: var(--sub); margin: 0 0 12px; font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .grid2 { display: grid; grid-template-columns: 360px 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  @media (max-width: 960px) { .grid2, .grid3 { grid-template-columns: 1fr; } .grid4, .grid6 { grid-template-columns: 1fr 1fr; } }
  label.chk { display: flex; gap: 8px; align-items: center; padding: 5px 4px; cursor: pointer; }
  .field { margin: 8px 0; }
  .field > span { display: block; font-size: 12px; color: var(--sub); font-weight: 700; margin-bottom: 4px; }
  .btn { background: var(--navy); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn.blue { background: var(--blue); } .btn.orange { background: var(--orange); } .btn.green { background: var(--green); } .btn.red { background: var(--red); }
  .btn.ghost { background: #fff; color: var(--navy); border: 1px solid var(--line); }
  .btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
  .btn.big { padding: 12px 22px; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .result { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 10px; background: #fff; }
  .result.hit { border-color: var(--orange); background: var(--lorange); }
  .result h3 { margin: 0 0 6px; font-size: 15px; color: var(--navy); }
  .pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: #fff; background: var(--blue); margin-right: 4px; white-space: nowrap; }
  .pill.red { background: var(--red); } .pill.green { background: var(--green); } .pill.orange { background: var(--orange); } .pill.gray { background: #9AA5B4; } .pill.navy { background: var(--navy); } .pill.purple { background: #6B5BA8; color: #fff; }
  .pill.line { background: #fff; color: var(--blue); border: 1px solid var(--lblue); }
  .ai { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: #EDE7FB; color: #5B3FB5; }
  .man { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: #E7EEF8; color: var(--navy); }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; margin: 6px 0; font-size: 13px; }
  .kv b { color: var(--sub); font-weight: 700; }
  details { margin-top: 6px; } summary { cursor: pointer; color: var(--blue); font-weight: 700; font-size: 12.5px; }
  .cite { background: var(--bg); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 12.5px; }
  .cite b { color: var(--navy); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--navy); color: #fff; padding: 7px 8px; text-align: left; font-weight: 700; white-space: nowrap; }
  td { border-bottom: 1px solid var(--line); padding: 7px 8px; vertical-align: top; }
  tr:nth-child(even) td { background: #F8FAFD; }
  td.num, th.num { text-align: right; }
  .scroll { overflow-x: auto; }
  .muted { color: var(--sub); font-size: 12.5px; }
  .small { font-size: 12px; }
  .hidden { display: none !important; }
  .note { background: var(--lorange); border: 1px solid #E6C08A; border-radius: 8px; padding: 9px 12px; font-size: 12.5px; color: #7A5418; margin-bottom: 12px; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  pre { background: #0F1B33; color: #D8E3F5; padding: 12px; border-radius: 8px; font-size: 12px; overflow: auto; white-space: pre-wrap; max-height: 340px; }
  a { color: var(--blue); }
  /* KPI */
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .kpi .v { font-size: 24px; font-weight: 800; color: var(--navy); line-height: 1.2; }
  .kpi .l { font-size: 12px; color: var(--sub); }
  .kpi.alert .v { color: var(--red); }
  /* progress */
  .prog { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: #E3E9F2; }
  .prog span { display: block; height: 100%; }
  .prog .d { background: var(--green); } .prog .p { background: var(--orange); }
  .legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--sub); margin-top: 4px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .ncard { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; cursor: pointer; }
  .ncard:hover { border-color: var(--blue); }
  .ncard h4 { margin: 4px 0 8px; font-size: 13.5px; color: var(--navy); line-height: 1.4; }
  /* diff */
  .diff del { background: #F9D3D1; color: #8E1F1B; text-decoration: line-through; }
  .diff ins { background: #CDEBD9; color: #165C38; text-decoration: none; font-weight: 700; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cmp > div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fff; font-size: 13px; }
  .cmp .h { font-size: 11.5px; font-weight: 700; color: var(--sub); margin-bottom: 4px; }
  .cmp .old { background: #FFF8F7; } .cmp .new { background: #F5FBF7; }
  @media (max-width: 760px) { .cmp { grid-template-columns: 1fr; } }
  /* analysis steps */
  .steps { list-style: none; padding: 0; margin: 8px 0; }
  .steps li { padding: 5px 0; color: var(--sub); }
  .steps li.done { color: var(--text); } .steps li.done::before { content: "✓ "; color: var(--green); font-weight: 800; }
  .steps li.run::before { content: "◌ "; color: var(--blue); font-weight: 800; }
  .steps li.wait::before { content: "· "; }
  .rec { border: 1px dashed var(--lblue); border-radius: 8px; padding: 8px 10px; margin: 6px 0; background: #FAFCFF; }
  .rec .loc { font-weight: 700; color: var(--navy); font-size: 12.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .chip b { color: var(--navy); }
  .src { display: flex; justify-content: space-between; gap: 6px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .ok { color: var(--green); font-weight: 700; }
  .flow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 860px) { .flow { grid-template-columns: 1fr 1fr; } }
  .step { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .step .n { display: inline-flex; width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; margin-right: 6px; }
  .step b { color: var(--navy); }
  .step p { margin: 6px 0 0; font-size: 12.5px; color: var(--sub); }
  .step .gh { font-size: 11.5px; color: var(--orange); font-weight: 700; margin-top: 6px; }
  .toast { position: fixed; right: 18px; bottom: 18px; background: var(--navy); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.2); opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 420px; }
  .toast.show { opacity: 1; }
  tr.over td { background: #FFF4F3 !important; }
  tr.na td { background: #F3F4F6 !important; color: #8A93A3; }
  #taskTable { table-layout: fixed; min-width: 1210px; }
  #taskTable td { word-break: keep-all; overflow-wrap: anywhere; }
  #taskTable td.act { font-size: 12.5px; line-height: 1.45; }
  #taskTable select, #taskTable input[type=date] { width: 100%; max-width: 100%; }
  #taskTable .pill { font-size: 10.5px; padding: 1px 6px; }
  #taskTable textarea { width: 100%; }
  tr.na td b { color: #8A93A3; }
  .tasks select, .tasks input[type=date] { padding: 3px 5px; font-size: 12.5px; }
  .kxh { font-size: 11.5px; font-weight: 800; color: var(--sub); margin: 10px 4px 4px; }
  .kxi { display: flex; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 12.5px; line-height: 1.35; }
  .kxi:hover { background: var(--bg); } .kxi.on { background: #E3ECF8; outline: 1px solid var(--lblue); }
  .kxi i { flex: 0 0 4px; border-radius: 2px; }
  .kxrule { display: flex; gap: 10px; align-items: flex-start; background: var(--bg); border-radius: 8px; padding: 10px; margin: 8px 0; }
  .kxif { background: var(--navy); color: #fff; font-weight: 800; font-size: 11px; padding: 3px 8px; border-radius: 5px; flex: 0 0 auto; }
  .kxif.then { background: var(--orange); }
  #kxGraph .gnode:hover rect:first-child { filter: drop-shadow(0 2px 4px rgba(27,47,91,.25)); }
  .pg { position: relative; margin: 0 auto 14px; max-width: 820px; box-shadow: 0 2px 8px rgba(0,0,0,.15); background: #fff; }
  .pg img { width: 100%; display: block; }
  .pg .hl { position: absolute; background: rgba(255,214,0,.33); outline: 2px solid #E0A800; border-radius: 3px; }
  .pg .pno { position: absolute; top: 6px; right: 8px; font-size: 11px; background: var(--navy); color: #fff; padding: 1px 7px; border-radius: 999px; }
  .doc { max-width: 820px; margin: 0 auto; background: #fff; padding: 28px 34px; box-shadow: 0 2px 8px rgba(0,0,0,.15); font-family: "Batang", "Nanum Myeongjo", serif; font-size: 14px; line-height: 1.8; }
  .doc .art { padding: 4px 6px; border-radius: 4px; margin: 2px 0; white-space: pre-wrap; }
  .doc .art.on { background: rgba(255,214,0,.33); outline: 2px solid #E0A800; }
  .doc h4 { text-align: center; margin: 0 0 4px; font-size: 18px; }
  tr.hlr td { background: rgba(255,214,0,.4) !important; font-weight: 700; }
  .srcbtn { font-size: 11.5px; margin-left: 6px; }
  .printonly { display: none; }
  .cgt td, .cgt th { vertical-align: middle; }
  .cgt input[type=number], .cgt input[type=text], .cgt select { width: 100%; }
  .cgt td.cur { color: var(--sub); background: #F6F8FB !important; }
  .cgt tr.chg td.after input, .cgt tr.chg td.after select { border-color: var(--orange); background: var(--lorange); font-weight: 700; }
  .flag { display: flex; gap: 8px; padding: 6px 8px; border-radius: 6px; margin: 4px 0; background: var(--lorange); border: 1px solid #E6C08A; font-size: 13px; }
  .flag.no { background: #F6F8FB; border-color: var(--line); color: var(--sub); }
  .nsum { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-top: 12px; background: #FAFBFD; font-size: 13px; }
  .nsum h4 { margin: 0 0 6px; color: var(--navy); font-size: 14px; }
  .nsum ul { margin: 4px 0 0; padding-left: 18px; } .nsum li { margin: 2px 0; }
  @media print { header .who, .bar, .note, .noprint, .toast, #srcModal { display: none !important; } body { background: #fff; } .card { box-shadow: none; } .printonly { display: block !important; }
    .nsum { break-inside: avoid; } details { display: block; } .scroll { overflow: visible !important; } #taskTable { font-size: 10.5px; min-width: 0 !important; width: 100%; } #taskTable select, #taskTable input { font-size: 10.5px; padding: 1px 2px; } .wrap { max-width: none; } }
</style>
<style>
  .seg .btn { border-radius: 0; } .seg .btn:first-child { border-radius: 8px 0 0 8px; } .seg .btn:last-child { border-radius: 0 8px 8px 0; }
  .kxi { display:flex; gap:8px; padding:8px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .kxi:hover { background:#F4F7FC; } .kxi.on { background:#EAF1FB; border-color:#B9CDEB; }
  .kxi i { width:4px; border-radius:2px; flex:0 0 4px; }
  .kxh { font-size:12.5px; font-weight:700; color:var(--navy); margin:10px 4px 4px; }
  .chip { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:14px; padding:3px 10px; margin:2px; font-size:12.5px; background:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:2px; margin:4px 0; }
  .condrow { display:grid; grid-template-columns: 1fr 180px 220px 30px; gap:6px; align-items:center; margin:4px 0; }
  .step { display:inline-flex; align-items:center; gap:6px; } .step b { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--navy); color:#fff; font-size:12px; }
  .arttext { white-space:pre-wrap; background:#F7F9FC; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px; line-height:1.6; }
  .toast { position:fixed; right:20px; bottom:20px; background:var(--navy); color:#fff; padding:10px 16px; border-radius:10px; opacity:0; transition:.2s; z-index:90; max-width:420px; } .toast.show { opacity:1; }
</style>
</head>

<header>
  <div>
    <h1>화관법 규칙 저작 도구 · 시연</h1>

  </div>

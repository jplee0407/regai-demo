- id: N-2026-031
  제목: "[가상] 화학물질관리법 시행규칙 일부개정 — 변경 계획서 제출 기한 30일 → 60일"
  구분: 시행규칙
  발령기관: 기후에너지환경부
  공포번호: 기후에너지환경부령 제XX호 (가상)
  공포일: 2026-11-18
  시행일: 2027-01-01
  감지일: 2026-11-19
  감지경로: 법제처 Open API (현행법령 조문 해시 비교)
  요약: 변경된 화학사고예방관리계획서 제출 기한을 변경완료일 30일 이전에서 60일 이전으로 앞당김
  변경조문:
    - id: RULE-19-6
      조문: 시행규칙 제19조제6항
      제목: 화학사고예방관리계획서의 작성·제출 등
      구: 변경된 화학사고예방관리계획서는 변경완료일 30일 이전까지 별지 제32호서식에 따라 화학물질안전원장에게 제출하여야 한다.
      신: 변경된 화학사고예방관리계획서는 변경완료일 60일 이전까지 별지 제32호서식에 따라 화학물질안전원장에게 제출하여야 한다.
  영향규칙:
    - 대상: 변경관리
      조건: {상태: 진행, 계획서대상: true}
      영향: "{이름}: 계획서 제출 기한 {기존기한} → {신기한} (30일 단축)"
      조치: 변경 계획서 작성 일정 재수립 및 조기 제출
      기한: {기준: 신기한, 일수: 0}
      신뢰도: 0.97
    - 대상: 교육
      대상명: 변경관리 담당자 공지
      영향: 설비·공정 변경 담당자가 새 제출 기한을 알아야 함
      조치: 변경관리 담당자 대상 개정 내용 공지·교육
      부서: 환경안전팀
      기한: {기준: 시행일, 일수: -14}
      신뢰도: 0.88
  문서수정:
    - 문서: MOC
      위치: "4.3 화학사고예방관리계획서 변경 제출"
      현행: 변경관리 대상이 계획서 변경 사항에 해당하면, 환경안전팀은 변경완료 예정일 30일 전까지 변경된 계획서를 화학물질안전원에 제출한다.
      수정안: 변경관리 대상이 계획서 변경 사항에 해당하면, 환경안전팀은 변경완료 예정일 60일 전까지 변경된 계획서를 화학물질안전원에 제출한다. 변경 요청 접수 시 제출 기한을 자동 계산하여 변경관리 일정에 반영한다.
      사유: 시행규칙 제19조제6항 제출 기한 변경 (30일 → 60일)
    - 문서: MOC
      위치: "별표 1 변경관리 단계별 일정표"
      현행: "계획서 작성 착수: 변경완료 예정일 D-45 / 제출: D-30"
      수정안: "계획서 작성 착수: 변경완료 예정일 D-90 / 제출: D-60"
      사유: 제출 기한이 앞당겨져 작성 착수 시점도 함께 조정
    - 문서: PLAN
      위치: "1.4 계획서 변경 관리"
      현행: 변경 사항 발생 시 변경완료일 30일 이전에 변경 계획서를 제출한다.
      수정안: 변경 사항 발생 시 변경완료일 60일 이전에 변경 계획서를 제출한다.
      사유: 계획서 내 관리 절차 문구를 개정 조문과 일치
  규칙제안:
    - 규칙: R-23-3
      종류: 기한일수
      항목: 변경 계획서 제출 기한 (변경완료 예정일 기준 일수)
      현행: -30
      제안: -60
      시행일: 2027-01-01
      근거: RULE-19-6
      설명: "제출 기한이 '30일 이전'에서 '60일 이전'으로 바뀌어 기한 계산 일수를 -30에서 -60으로 수정. 판정 조건(취급량 증가 등)은 변경 없음"


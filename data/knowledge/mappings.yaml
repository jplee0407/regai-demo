# 고객별 데이터 매핑 (가상 고객 — 시연용). 원천 위치 → 표준 필드. 없는 필드는 판정 불가로 표시
# 상태: 연결(그대로) / 변환(코드·단위 변환 필요) / 계산(공통 로직으로 계산, 입력 필드 필요) / 입력(담당자 입력 화면) / 없음
- 고객: OO화학 (TO21 e-CMS 사용)
  설명: TO21 CMS의 데이터 모델 = 표준 모델. 매핑 거의 불필요
  시스템: [TO21 e-CMS, s-CAPP(계획서 관리)]
  기본상태: 연결
  기본원천: "e-CMS 표준 모델"
  예외:
    위험도_증가: {원천: "e-CMS 변경관리 화면 체크 항목", 상태: 입력}
    표시_항목: {원천: "모바일 현장점검 결과", 상태: 입력}
- 고객: A사 (타사 ERP + 엑셀 관리)
  설명: 물질·재고는 ERP, 시설·검사는 엑셀, 변경관리는 전자결재 양식
  시스템: [SAP ERP, 시설관리 엑셀, 전자결재(MOC 양식)]
  기본상태: 없음
  기본원천: ""
  예외:
    CAS: {원천: "ERP MARA.ZCAS", 상태: 연결}
    함량: {원천: "ERP 자재 특성 ZCONC", 상태: 변환, 변환: "문자열 '35 %' → 숫자 35"}
    성상: {원천: "ERP 자재 특성 ZSTATE", 상태: 변환, 변환: "L/S/G 코드 → 액체/고체/기체"}
    최대보유량_t: {원천: "ERP 재고 MARD (월별 최대)", 상태: 변환, 변환: "kg → t, 사업장 합계"}
    규정수량_구간: {원천: "공통 계산", 상태: 계산}
    규정수량_이상_증가: {원천: "공통 계산", 상태: 계산}
    시설_유형: {원천: "시설관리.xlsx '유형' 열", 상태: 변환, 변환: "자사 코드 → 표준 유형"}
    용량: {원천: "시설관리.xlsx '용량(L)'", 상태: 변환, 변환: "L → m³"}
    위험도: {원천: "시설관리.xlsx '등급'", 상태: 연결}
    최근_검사일: {원천: "시설관리.xlsx '최근검사'", 상태: 연결}
    변경완료_예정일: {원천: "전자결재 MOC 양식 '완료예정일'", 상태: 연결}
    취급시설_용량_증가: {원천: "공통 계산 (MOC 양식 변경 후 용량)", 상태: 계산}
    물질_변경_추가: {원천: "공통 계산 (MOC 양식 물질 목록)", 상태: 계산}
    위험도_증가: {원천: "RegAI 입력 화면 (MOC 연계)", 상태: 입력}
    시설_위치_변경: {원천: "전자결재 MOC 양식 '변경유형'", 상태: 변환, 변환: "자유기재 → 표준 변경유형 (AI 분류 + 확인)"}
    사업장군: {원천: "공통 계산", 상태: 계산}
    최근_적합통보일: {원천: "RegAI 입력 화면 (계획서 이력)", 상태: 입력}
    취급량_증가: {원천: "공통 계산 (MOC 양식 변경 후 취급량)", 상태: 계산}
    신규_취급시설: {원천: "전자결재 MOC 양식 '변경유형'", 상태: 변환, 변환: "자유기재 → 표준 변경유형 (AI 분류 + 확인)"}
    함량_농도_성상_변경: {원천: "공통 계산 (MOC 양식 변경 후 함량·성상)", 상태: 계산}
    주요취급시설_운영: {원천: "RegAI 입력 화면 (사업장 정보)", 상태: 입력}
    연속적합_횟수: {원천: "시설관리.xlsx 검사 이력 시트", 상태: 계산}
    검사기관수: {원천: "시설관리.xlsx 검사 이력 시트", 상태: 계산}
    표시_항목: {원천: "RegAI 모바일 현장점검", 상태: 입력}
- 고객: B사 (변경관리 시스템 없음)
  설명: 물질 대장만 엑셀로 관리. 변경관리·계획서 이력은 RegAI 입력 화면으로 신규 수집
  시스템: [물질대장 엑셀]
  기본상태: 없음
  기본원천: ""
  예외:
    CAS: {원천: "물질대장.xlsx", 상태: 연결}
    함량: {원천: "물질대장.xlsx", 상태: 연결}
    성상: {원천: "물질대장.xlsx", 상태: 연결}
    최대보유량_t: {원천: "물질대장.xlsx '최대저장량(kg)'", 상태: 변환, 변환: "kg → t"}
    규정수량_구간: {원천: "공통 계산", 상태: 계산}
    위험도_증가: {원천: "RegAI 입력 화면", 상태: 입력}
    변경완료_예정일: {원천: "RegAI 입력 화면 (변경 등록)", 상태: 입력}
    취급시설_용량_증가: {원천: "RegAI 입력 화면 (변경 등록)", 상태: 입력}

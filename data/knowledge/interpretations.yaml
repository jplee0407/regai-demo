# 해석·판단 지식 (시연용 가상 사례 — 실제 유권해석·질의회신 아님)
# 법령만으로 판단이 애매한 부분을 유권해석·질의회신·컨설턴트 판단으로 보완하고, 근거 조문·적용 규칙과 연결한다.
- id: I-001
  구분: 유권해석
  제목: "'취급량 증가'에 일시적 재고 증가가 포함되는지"
  질의: 정비 기간 중 일시적으로 저장량이 늘어난 경우도 계획서 변경 제출 대상인 취급량 증가에 해당하는지
  판단: 계획서에 적은 최대 취급량(연간·일일)을 넘는 경우에만 취급량 증가로 보며, 계획서 범위 안의 일시적 재고 변동은 해당하지 않음
  출처: 기후에너지환경부 질의회신 (가상, 2026-03-12)
  확인자: 김지훈
  신뢰수준: 공식
  상태: 유효
  일자: 2026-03-12
  관련조문: [ACT-23-3-1]
  적용규칙: [R-23-3]
  적용방법: "판정 시 '취급량 증가'는 계획서 최대 취급량 초과 여부로 확인 (조건 설명에 반영)"
- id: I-002
  구분: 컨설턴트 판단
  제목: 소용량 소분 용기의 표시 항목 간소화 범위
  질의: 100 mL 이하 시약 소분 용기에 7개 항목을 모두 표시하기 어려운 경우의 처리
  판단: 명칭·그림문자·신호어는 용기에 직접 표시하고, 나머지 항목은 외부 포장 또는 꼬리표로 표시하면 적합으로 판단 (최근 점검 사례 기준)
  출처: TO21 컨설팅본부 검토의견 (가상, CR-2025-118)
  확인자: 문소희
  신뢰수준: 내부
  상태: 유효
  일자: 2025-11-04
  관련조문: [ACT-16-1, RULE-12]
  적용규칙: [R-16-1]
  적용방법: "표시 점검에서 소분 용기는 '외부 포장 표시 확인' 질문을 추가로 확인"
- id: I-003
  구분: 질의회신
  제목: "정기검사 연장 요건의 '2개 이상 검사기관' 의미"
  질의: 같은 검사기관의 서로 다른 지사에서 검사를 받은 경우 2개 기관으로 볼 수 있는지
  판단: 법인이 같으면 지사가 달라도 1개 기관으로 봄
  출처: 화학물질안전원 질의회신 (가상, 2026-06-20)
  확인자: 김지훈
  신뢰수준: 공식
  상태: 검토 중
  일자: 2026-06-20
  관련조문: [RULE-23-3]
  적용규칙: [R-24-2]
  적용방법: "시설 정보의 검사기관수는 법인 기준으로 입력"

# 표준 데이터 모델 (판정 필드 사전) — 규칙은 이 필드 이름만 사용하고, 고객 데이터는 매핑으로 여기에 연결
# 구분: 원천(시스템에 있는 값) / 계산(원천 값에서 공통 로직으로 계산) / 입력(담당자가 답하는 값)
# 형식: 예/아니오, 날짜, 숫자, 코드, 텍스트
- 엔터티: 사업장
  필드:
    - {필드: 사업장군, 이름: 계획서 작성수준, 형식: 코드, 값: "1군 / 2군 / 기타", 구분: 계산, 계산: "물질별 규정수량 구간 + 주요취급시설 운영 (R-GRP-1)", 키워드: [1군, 2군, 작성수준]}
    - {필드: 사업장군_1군, 이름: 1군 사업장 여부, 형식: 예/아니오, 구분: 계산, 계산: "사업장군 = 1군", 키워드: [1군]}
    - {필드: 주요취급시설_운영, 이름: 주요취급시설 운영 여부, 형식: 예/아니오, 구분: 원천, 키워드: [주요취급시설]}
    - {필드: 작성수준_2군에서_1군, 이름: 작성수준 2군→1군 상향, 형식: 예/아니오, 구분: 계산, 계산: "변경 전·후 사업장군 비교", 키워드: [상향, 2군, 1군으로]}
    - {필드: 사업장_이전, 이름: 사업장 이전(주소지 변경), 형식: 예/아니오, 구분: 원천, 키워드: [이전, 주소지]}
- 엔터티: 물질
  필드:
    - {필드: CAS, 이름: CAS 번호, 형식: 텍스트, 구분: 원천, 키워드: [CAS]}
    - {필드: 함량, 이름: 함량, 형식: 숫자, 단위: "%", 구분: 원천, 키워드: [함량, 농도]}
    - {필드: 성상, 이름: 성상, 형식: 코드, 값: "기체 / 액체 / 고체", 구분: 원천, 키워드: [성상]}
    - {필드: 최대보유량_t, 이름: 최대보유량, 형식: 숫자, 단위: t, 구분: 원천, 키워드: [최대보유량, 보유량]}
    - {필드: 규정수량_구간, 이름: 규정수량 구간, 형식: 코드, 값: "상위 이상 / 하위 이상 / 최하위 이상 / 미만", 구분: 계산, 계산: "CAS·함량·성상·최대보유량 + 규정수량 표 (R-QTY-1)", 키워드: [규정수량]}
    - {필드: 규정수량_이상_증가, 이름: 최대보유량이 규정수량 이상으로 증가, 형식: 예/아니오, 구분: 계산, 계산: "변경 전 구간 = 미만 → 변경 후 하위 이상", 키워드: [규정수량 이상으로 증가, 최대보유량이]}
    - {필드: 신규_유해화학물질_취급, 이름: 유해화학물질 신규 취급, 형식: 예/아니오, 구분: 계산, 계산: "이전 미취급 물질이 규정수량 이상으로 추가", 키워드: [취급하지 않던, 신규 취급]}
- 엔터티: 시설
  필드:
    - {필드: 시설_유형, 이름: 취급시설 유형, 형식: 코드, 구분: 원천, 키워드: [저장탱크, 시설 유형]}
    - {필드: 용량, 이름: 취급시설 용량, 형식: 숫자, 단위: m³, 구분: 원천, 키워드: [용량]}
    - {필드: 위험도, 이름: 시설 위험도, 형식: 코드, 값: "가 / 나 / 다", 구분: 원천, 키워드: [위험도]}
    - {필드: 최근_검사일, 이름: 최근 정기검사일, 형식: 날짜, 구분: 원천, 키워드: [최근 검사, 정기검사]}
    - {필드: 연속적합_횟수, 이름: 연속 적합 횟수, 형식: 숫자, 구분: 계산, 계산: "검사 이력에서 연속 적합 집계", 키워드: [연속, 적합]}
    - {필드: 검사기관수, 이름: 검사기관 수, 형식: 숫자, 구분: 계산, 계산: "검사 이력의 서로 다른 검사기관 수", 키워드: [검사기관]}
- 엔터티: 변경관리
  필드:
    - {필드: 변경완료_예정일, 이름: 변경완료 예정일, 형식: 날짜, 구분: 원천, 키워드: [변경완료일, 변경완료]}
    - {필드: 검사_개시일, 이름: 취급시설 검사 개시일, 형식: 날짜, 구분: 원천, 키워드: [검사 개시일, 검사개시일]}
    - {필드: 취급량_증가, 이름: 취급량 증가, 형식: 예/아니오, 구분: 계산, 계산: "변경 후 최대 취급량 > 계획서 최대 취급량 (해석 I-001)", 키워드: [취급량]}
    - {필드: 취급시설_용량_증가, 이름: 취급시설 용량 증가, 형식: 예/아니오, 구분: 계산, 계산: "변경 후 용량 > 현재 용량", 키워드: [용량이 증가, 용량 증가]}
    - {필드: 신규_취급시설, 이름: 새로운 취급시설 설치, 형식: 예/아니오, 구분: 원천, 키워드: [새로운 취급시설, 새롭게 설치, 신규 시설]}
    - {필드: 신규_취급시설_설치, 이름: 취급시설 신규 설치·운영, 형식: 예/아니오, 구분: 원천, 키워드: [새롭게 설치, 설치ㆍ운영]}
    - {필드: 물질_변경_추가, 이름: 유해화학물질 변경·추가, 형식: 예/아니오, 구분: 계산, 계산: "변경 후 물질 목록 - 현재 물질 목록", 키워드: [변경·추가, 물질 추가, 물질이 추가, 품목]}
    - {필드: 함량_농도_성상_변경, 이름: 함량·농도·성상 변경, 형식: 예/아니오, 구분: 계산, 계산: "변경 전·후 함량·성상 비교", 키워드: [함량, 농도, 성상]}
    - {필드: 위험도_증가, 이름: 위험 증가, 형식: 예/아니오, 구분: 입력, 계산: "담당자 판단 (해석 기준 참고)", 키워드: [위험이 증가, 위험 증가]}
    - {필드: 시설_위치_변경, 이름: 사업장 내 시설 위치 변경, 형식: 예/아니오, 구분: 원천, 키워드: [위치, 위치 변경]}
- 엔터티: 계획서
  필드:
    - {필드: 최근_적합통보일, 이름: 최근 적합통보일, 형식: 날짜, 구분: 원천, 키워드: [적합통보, 적합 통보]}
    - {필드: 재제출_확인, 이름: 재제출 시기 확인 대상, 형식: 예/아니오, 구분: 계산, 계산: "1군 + 적합통보 이력 있음", 키워드: [재제출]}
    - {필드: 부적합_통보, 이름: 부적합 통보 받음, 형식: 예/아니오, 구분: 원천, 키워드: [부적합]}
    - {필드: 부적합_통보일, 이름: 부적합 통보일, 형식: 날짜, 구분: 원천, 키워드: [부적합 통보]}
    - {필드: 주민소산_보완_통지, 이름: 주민소산 계획 보완 통지 받음, 형식: 예/아니오, 구분: 원천, 키워드: [주민소산, 보완 통지]}
    - {필드: 보완_통지일, 이름: 보완 통지일, 형식: 날짜, 구분: 원천, 키워드: [통지일, 통지를 받은]}
- 엔터티: 표시
  필드:
    - {필드: 표시_항목, 이름: 라벨에 있는 표시 항목, 형식: 텍스트, 구분: 입력, 계산: "현장 점검·사진 판독 결과", 키워드: [표시, 라벨]}

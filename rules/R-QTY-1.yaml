# 물질별 규정수량 구간 판정 (AI 초안 — 고시 원문 기반, 전문가 확정 전)
id: R-QTY-1
이름: 물질별 규정수량 구간 판정
유형: 수량판정
의무분류: C01-2
연관분류: [C02, C03, C04]
대상: 물질
설명: CAS·함량·성상·최대보유량으로 별표 2(인체등유해성) 또는 별표 3(사고대비물질)의 규정수량을 찾아 최하위·하위·상위 구간을 판정
출처고시: 유해화학물질의 규정수량에 관한 규정 (화학물질안전원고시 제2026-20호)
버전:
  - 버전: 1
    시행일: 2026-10-14
    폐지일: null
    승인: "검토 대기 (AI 초안, 2026-11-20)"
    근거: [QTY-2, QTY-3, QTY-4, QTY-B2-일반, QTY-B3-일반]
    옵션:
      사고대비우선: true
      저확산적용: true
      복수구분: 최소값
      기준표: data/knowledge/qty-table.json
    구간:
      - {이름: 상위 이상, 기준: 상위}
      - {이름: 하위 이상, 기준: 하위}
      - {이름: 최하위 이상, 기준: 최하위}
    검토:
      작성: Claude (AI)
      작성일: 2026-11-20
      요약: "사고대비물질이면 별표 3, 아니면 별표 2를 적용. 함량기준 이상일 때만 대상. 액체이면 용액(*) 값, 액체·고체이면서 저확산 표시가 있으면 저확산 값 적용. 최대보유량을 최하위·하위·상위 규정수량과 비교"
      쟁점:
        - "급성·만성·생태 등 복수 구분이 함께 해당하면 가장 낮은(엄격한) 규정수량을 적용하도록 했음 — 고시에 명시 문구가 없어 확인 필요"
        - "혼합물은 별표 4 비고 2에 따라 '전체 혼합물 총량'으로 최대보유량을 산정해야 함 — 입력값이 총량인지 순물질량인지 사업장 데이터 기준 확인 필요"
        - "별표 3 값은 규정수량 규정 전문(제2025-12호) 기준. 이후 개정(제2026-4호·제2026-20호)에서 별표 3 변경 여부 확인 필요"
        - "표 변환(HWPX → 데이터) 과정의 오탈자 가능성 — 표본 물질 대조 검증 필요"
      사례:
        - {설명: "염산 35% 액체 180 t (사고대비 — 염화수소 용액*)", 입력: {CAS: 7647-01-0, 함량: 35, 보유량: 180, 성상: 액체}, 기대: {구간: 상위 이상, 하위: 8, 상위: 40}}
        - {설명: "톨루엔 99% 410 t (사고대비)", 입력: {CAS: 108-88-3, 함량: 99, 보유량: 410, 성상: 액체}, 기대: {구간: 상위 이상, 하위: 2, 상위: 400}}
        - {설명: "수산화나트륨 48% 수용액 240 t (저확산 적용)", 입력: {CAS: 1310-73-2, 함량: 48, 보유량: 240, 성상: 액체}, 기대: {구간: 최하위 이상, 하위: 400}}
        - {설명: "메탄올 70% (사고대비 함량기준 85% 미달)", 입력: {CAS: 67-56-1, 함량: 70, 보유량: 90, 성상: 액체}, 기대: {해당: false}}
